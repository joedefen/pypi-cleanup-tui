[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypi-cleanup-tui"
version = "1.0.0"
description = "A terminal user interface for cleaning up PyPI packages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = []
keywords = ["pypi", "cleanup", "tui", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "packaging>=23.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/your-username/pypi-cleanup-tui"
Repository = "https://github.com/your-username/pypi-cleanup-tui"
Issues = "https://github.com/your-username/pypi-cleanup-tui/issues"

[project.scripts]
pypi-cleanup-tui = "pypi_cleanup_tui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pypi_cleanup_tui"]
