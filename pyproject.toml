[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pypi-cleanup-tui"
dynamic = ["version"]
description = "A terminal user interface for cleaning up PyPI packages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = []
keywords = ["pypi", "cleanup", "tui", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "console-window>=3.1.0,<3.2",
    "packaging>=26",
    "pexpect>=4.9",
    "pyotp>=2.9",
    "requests>=2.28",
]

[project.scripts]
pypi-cleanup-tui = "pypi_cleanup_tui.main:main"